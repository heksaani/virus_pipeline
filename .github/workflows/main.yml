# Runs the tests and linter on every push to main and on every pull request.
# The tests use tests/fake_tools/conda instead of real conda environments,
# so no bioinformatics tools or databases are needed here.
# Gitea Actions also reads .github/workflows/, so this file works there too
# once a runner is set up.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]   # oldest supported, and the one we develop on
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked          # fails if uv.lock is out of date with pyproject.toml
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
